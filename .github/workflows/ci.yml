name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Install native toolchain
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Check input clock synchronization
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp app/src/test/cpp/ClockedStereoBufferTest.cpp -o /tmp/djmrec-clock-sync-test
          /tmp/djmrec-clock-sync-test
      - name: Lint, test, and build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
